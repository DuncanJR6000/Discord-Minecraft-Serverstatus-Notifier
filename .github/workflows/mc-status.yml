name: MC Status

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch:

permissions:
  contents: write            # nötig, um state.json zu committen

concurrency:
  group: mc-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Server prüfen
        run: python mc_status_bot.py
        env:
          MC_ADDRESS: ${{ vars.MC_ADDRESS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ON_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Zustand speichern
        run: |
          git config user.name "mc-status-bot"
          git config user.email "mc-status-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Status aktualisiert" && git push)
